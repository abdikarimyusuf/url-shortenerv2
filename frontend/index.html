<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>URL Shortener</title>
    <link rel="stylesheet" href="style.css">
</head>

<body>

    <div class="container">

        <h1>Abdulkarim's URL Shortener</h1>

        <p>Let's shorten your URLs for you to something manageable</p>
        <p>Enter a URL and create a short link.</p>

        <form id="shorten-form">

            <input
                id="url-input"
                type="url"
                placeholder="https://example.com"
                required
            >

            <button type="submit">
                Shorten URL
            </button>

        </form>

        <div id="result"></div>

    </div>

    <script src="app.js"></script>

</body>
</html>
